@switch (state) {
  @case ('loading') {
    <app-alert type="info" message="Cargando procesadores Intel..."></app-alert>
  }
  @case ('error') {
    <app-alert type="danger" message="No se pudieron cargar los procesadores Intel."></app-alert>
  }
  @case ('success') {
    <app-intel-table [processors]="processors"></app-intel-table>
  }
}
