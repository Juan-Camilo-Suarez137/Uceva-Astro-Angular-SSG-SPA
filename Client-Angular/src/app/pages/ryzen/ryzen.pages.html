@switch(state){

    @case('loading'){
        <app-alert alertState="loading" text="Cargando Procesadores Ryzen..." ></app-alert>
    }

    @case('error'){
        <app-alert alertState="error" text="Error al Cargar los Procesadores Ryzen" ></app-alert>
    }

    @case('success'){
        <app-ryzen-table [processors]="processors" ></app-ryzen-table>
    }

}
